<style id="css">
/* Layout: boutique vitrina for clients (shelf, product sheet, order ticket to WhatsApp, sticky total). The owner alone gets a top strip switching to Cotizar (private quoting with costs) and Administrar (catalog editor that republishes this page). */
:root{
  --bg:#F1F4F7; --surface:#FFFFFF; --ink:#0E1C2B; --muted:#5B6C7D; --line:#D6DEE6;
  --marine:#173F72; --marine-ink:#FFFFFF; --ice:#DDE9F4; --lume:#9C7A3C; --private:#FFF6E6; --private-line:#EBCB8F;
  --good:#1D7A4E; --warn:#B4441F;
  --display:"Syncopate","Arial Black",system-ui,sans-serif;
  --body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0A121C; --surface:#111D2B; --ink:#E6EDF4; --muted:#93A5B8; --line:#22364B;
  --marine:#6FA6EA; --marine-ink:#06101C; --ice:#152C45; --lume:#E0B866; --private:#2A2416; --private-line:#6B5427;
  --good:#53C48D; --warn:#F08A63; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0A121C; --surface:#111D2B; --ink:#E6EDF4; --muted:#93A5B8; --line:#22364B;
  --marine:#6FA6EA; --marine-ink:#06101C; --ice:#152C45; --lume:#E0B866; --private:#2A2416; --private-line:#6B5427;
  --good:#53C48D; --warn:#F08A63; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.55;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 120px}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:36px}
.view{display:flex;flex-direction:column;gap:36px}
header{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:22px;flex-wrap:wrap}
.mark{font-family:var(--display);font-weight:700;font-size:28px;letter-spacing:.22em;line-height:1}
.mark small{display:block;font-weight:400;font-size:10px;letter-spacing:.42em;color:var(--muted);margin-top:8px}
.lang{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.lang button{border:0;background:transparent;color:var(--muted);font:600 13px var(--body);padding:6px 12px;cursor:pointer}
.lang button[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.hero h1{font-family:var(--display);font-weight:400;font-size:clamp(20px,5vw,30px);letter-spacing:.06em;line-height:1.3;margin:0 0 10px;text-wrap:balance;text-transform:uppercase}
.hero p{margin:0;color:var(--muted);max-width:58ch}
h2{font-weight:700;font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);margin:0 0 12px}
.empty{color:var(--muted);font-size:14px}
.empty.pad{padding:18px 16px}
.noimg{width:100%;max-width:100%;aspect-ratio:1;display:flex;align-items:center;justify-content:center;background:var(--ice);border-radius:10px;color:var(--muted);font-family:var(--display);font-size:12px;letter-spacing:.3em}
.noimg.big{font-size:18px}
.noimg.sm{width:56px;height:56px;aspect-ratio:auto;font-family:var(--body);letter-spacing:0;font-size:11px;flex:none}

.shelf{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:620px){.shelf{grid-template-columns:repeat(3,minmax(0,1fr))}}
.w{display:flex;flex-direction:column;gap:6px;text-align:left;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:14px;padding:10px;cursor:pointer;font:inherit;min-width:0}
.w img{width:100%;max-width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block;background:var(--ice)}
.w b{font-size:15px;line-height:1.25}
.w .p{font-family:var(--mono);font-size:14px;color:var(--muted)}
.w[aria-pressed="true"]{border-color:var(--marine);box-shadow:inset 0 0 0 1px var(--marine)}

.product{display:grid;grid-template-columns:1fr;gap:20px;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:16px}
@media (min-width:640px){.product{grid-template-columns:minmax(0,1fr) minmax(0,1fr);padding:20px}}
.product .photo img{width:100%;max-width:100%;border-radius:12px;display:block}
.info{display:flex;flex-direction:column;gap:14px;min-width:0}
.info h3{font-family:var(--display);font-weight:700;font-size:20px;letter-spacing:.08em;margin:0;line-height:1.3;text-transform:uppercase}
.price{font-family:var(--mono);font-size:26px}
.price small{font-family:var(--body);font-size:13px;color:var(--muted);margin-left:6px}
.incl{display:flex;gap:8px;align-items:center;font-size:14px;font-weight:600;color:var(--lume)}
.incl svg{width:18px;height:18px;flex:none}
.specs{margin:0;padding:0;list-style:none;border-top:1px solid var(--line)}
.specs li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
.specs li span:first-child{color:var(--muted)}
.specs li span:last-child{text-align:right;font-weight:600}
.opts{display:flex;flex-direction:column;gap:10px}
label.chk{display:flex;gap:10px;align-items:center;font-size:15px;cursor:pointer}
label.chk input{width:20px;height:20px;accent-color:var(--marine);flex:none}
label.chk .ec{margin-left:auto;font-family:var(--mono);font-size:13px;color:var(--muted)}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label,.lbl{font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.08em;text-transform:uppercase}
input[type=text],input[type=tel],input[type=number],input[type=password],textarea,select{border:1px solid var(--line);border-radius:8px;padding:10px 12px;font:16px var(--body);background:var(--surface);color:var(--ink);width:100%;min-width:0}
input[type=number]{font-family:var(--mono)}
.stepper{display:flex;align-items:center;border:1px solid var(--line);border-radius:8px;overflow:hidden;width:max-content}
.stepper button{width:42px;height:42px;border:0;background:var(--bg);color:var(--ink);font-size:20px;cursor:pointer}
.stepper input{width:60px;height:42px;border:0;border-radius:0;text-align:center;padding:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:0;border-radius:10px;padding:13px 18px;font:700 16px var(--body);cursor:pointer;text-decoration:none}
.btn.primary{background:var(--marine);color:var(--marine-ink)}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn.sm{padding:7px 11px;font-size:13px}
.btn:disabled{opacity:.55;cursor:default}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--marine);outline-offset:2px}

.ticket{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.ticket .r{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line)}
.ticket .r .n{min-width:0}
.ticket .r .n b{display:block;font-size:15px}
.ticket .r .n small{color:var(--muted);font-size:13px}
.ticket .r .a{font-family:var(--mono);font-variant-numeric:tabular-nums}
.rm{border:0;background:transparent;color:var(--muted);font-size:20px;width:36px;height:36px;cursor:pointer;border-radius:6px}
.ticket .tot{display:flex;justify-content:space-between;padding:14px 16px;font-weight:700}
.ticket .tot b{font-family:var(--mono);font-size:20px}
form{display:grid;gap:12px}
.two{display:grid;grid-template-columns:1fr;gap:12px}
@media (min-width:540px){.two{grid-template-columns:1fr 1fr}}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.status{font-size:14px;color:var(--marine);min-height:1.2em}
.trust{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;text-align:center;font-size:13px;color:var(--muted)}
.trust b{display:block;color:var(--ink);font-size:14px}
.contact{font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px;display:flex;flex-direction:column;gap:4px}
.contact b{color:var(--ink);font-family:var(--mono);user-select:all}
.bar{position:fixed;left:0;right:0;bottom:0;background:var(--ink);color:var(--bg);z-index:5;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(12px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
.bar .in{max-width:760px;margin:0 auto;display:flex;justify-content:space-between;align-items:center;gap:12px}
.bar .t{display:flex;flex-direction:column;line-height:1.15}
.bar .t small{font-size:12px;opacity:.75}
.bar .t b{font-family:var(--mono);font-size:22px}
.bar a{background:var(--marine);color:var(--marine-ink);border-radius:8px;padding:10px 14px;font-weight:700;text-decoration:none;font-size:15px}

/* owner */
.ownerbar{background:var(--private);border:1px solid var(--private-line);border-radius:12px;padding:10px 12px;max-width:760px;margin:12px auto 0}
.ownerbar .in{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:8px}
.ownerbar .who{display:flex;gap:6px;align-items:center;font-size:13px;font-weight:700;color:var(--lume);letter-spacing:.06em;text-transform:uppercase}
.ownerbar .who svg{width:15px;height:15px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{border:1px solid var(--private-line);background:transparent;color:var(--ink);border-radius:999px;padding:7px 14px;font:700 14px var(--body);cursor:pointer}
.tabs button[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.ownnote{font-size:13px;color:var(--warn);min-height:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line);background:transparent;color:var(--ink);border-radius:999px;padding:8px 13px;font:600 14px var(--body);cursor:pointer}
.chip small{font-family:var(--mono);color:var(--muted);margin-left:4px;font-size:12px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chip[aria-pressed="true"] small{color:var(--bg);opacity:.75}
.dial-head{display:flex;justify-content:space-between;align-items:baseline}
.dial-head b{font-family:var(--mono);font-size:20px}
input[type=range]{width:100%;accent-color:var(--marine)}
.ticks{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11px;color:var(--muted)}
.qtop{display:grid;grid-template-columns:72px minmax(0,1fr);gap:12px;align-items:end}
.qtop img,.qtop .noimg{width:72px;height:72px;object-fit:cover;border-radius:10px;aspect-ratio:auto}
.split{display:grid;grid-template-columns:1fr;gap:10px}
@media (min-width:560px){.split{grid-template-columns:1.1fr 1fr}}
.client-price{background:var(--marine);color:var(--marine-ink);border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:4px}
.client-price .t{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;opacity:.85}
.client-price .p{font-family:var(--mono);font-weight:600;font-size:34px;line-height:1.1;font-variant-numeric:tabular-nums}
.client-price .u{font-size:13px;opacity:.85}
.mine{background:var(--private);border:1px dashed var(--private-line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:6px}
.mine .t{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--lume)}
.kv{display:flex;justify-content:space-between;gap:10px;font-size:14px}
.kv b{font-family:var(--mono);font-variant-numeric:tabular-nums}
.kv.big b{font-size:18px;color:var(--good)}
.kv.neg b{color:var(--warn)}
.warnline{font-size:13px;color:var(--warn)}
.override{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;color:var(--muted)}
.override input{width:120px}
pre.msg{white-space:pre-wrap;background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:12px;font:14px/1.5 var(--body);margin:0;user-select:all}
.hist{display:flex;flex-direction:column}
.h{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.h:last-child{border-bottom:0}
.h .n{min-width:0}
.h .n b{display:block;font-size:15px}
.h .n small{color:var(--muted);font-size:12px}
.h .a{text-align:right;font-family:var(--mono);font-size:14px;font-variant-numeric:tabular-nums}
.h .a small{display:block;color:var(--good);font-size:12px}
.alist{display:flex;flex-direction:column}
.arow{display:grid;grid-template-columns:56px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 0;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);font:inherit;text-align:left;cursor:pointer;width:100%}
.arow:last-child{border-bottom:0}
.arow img{width:56px;height:56px;object-fit:cover;border-radius:8px}
.arow .n{min-width:0}
.arow .n b{display:block;font-size:15px}
.arow .n small{color:var(--muted);font-size:12px;font-family:var(--mono)}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--ice);color:var(--marine)}
.pill.off{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.drop{position:relative;border:1px dashed var(--line);border-radius:10px;padding:14px;display:flex;gap:12px;align-items:center;font-size:14px;color:var(--muted);min-height:84px}
.drop input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.drop img{width:64px;height:64px;object-fit:cover;border-radius:8px;flex:none}
.slots{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.slot{position:relative;aspect-ratio:1;max-width:100%;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;font-weight:600;overflow:hidden;background:var(--bg)}
.slot img{width:100%;height:100%;object-fit:cover;display:block}
.slot input[type=file]{position:absolute;inset:0;opacity:0;cursor:pointer;width:100%;height:100%}
.slot .x{position:absolute;top:4px;right:4px;z-index:2;border:0;border-radius:999px;width:30px;height:30px;background:rgba(5,10,20,.7);color:#fff;font-size:18px;cursor:pointer}
.slot.over{border-color:var(--marine);background:var(--ice)}
s.was{color:var(--muted);font-size:.75em;margin-left:6px}
.sale{display:inline-block;font:700 12px var(--body);color:var(--marine-ink);background:var(--warn);border-radius:999px;padding:2px 8px;margin-left:8px;vertical-align:middle}
.thumbs{display:flex;gap:8px;margin-top:8px}
.thumbs button{border:1px solid var(--line);border-radius:8px;padding:0;width:64px;height:64px;overflow:hidden;background:var(--ice);cursor:pointer}
.thumbs button img{width:100%;height:100%;object-fit:cover;display:block;border-radius:0}
.thumbs button[aria-pressed="true"]{border-color:var(--marine);box-shadow:0 0 0 1px var(--marine)}
.drop.over{border-color:var(--marine);background:var(--ice)}
.note{font-size:13px;color:var(--muted);margin:0}
.xrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;padding-bottom:12px;border-bottom:1px solid var(--line);align-items:end}
@media (min-width:640px){.xrow{grid-template-columns:1.4fr 1.4fr .7fr .7fr auto}}
.modal{position:fixed;inset:0;background:rgba(5,10,20,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px))}
@media (min-width:600px){.modal{align-items:center}}
.sheet{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:16px;padding:18px;width:100%;max-width:420px;display:flex;flex-direction:column;gap:12px}
.sheet b{font-size:18px}
.warnmsg{font-size:14px;color:var(--warn);min-height:1.2em}
.adminlink{align-self:center;background:none;border:0;color:var(--muted);font:600 13px var(--body);text-decoration:underline;cursor:pointer;padding:10px}
.promo-prev{display:block;width:100%;max-width:420px;height:auto;border-radius:12px;border:1px solid var(--line);margin:0 auto}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px}
@media (prefers-reduced-motion:no-preference){.w,.btn,.chip{transition:border-color .15s,background .15s,color .15s}}
</style>

  want.forEach(function(k){ var r=sp.filter(function(r){return String(r[0]).toLowerCase()===k})[0]; if(r) out.push(r) });
  sp.forEach(function(r){ if(out.length<4&&out.indexOf(r)<0&&r[0]) out.push(r) }); return out.slice(0,4) }
function openPromo(id){ PROMO.id=id; PROMO.ix=0; var m=CAT.models.filter(function(x){return x.id===id})[0];
  $("promoTitle").textContent="Promocionar "+m.name; var ims=imgsOf(m);
  $("promoPicsWrap").hidden=ims.length<2; $("promoPics").innerHTML="";
  ims.forEach(function(u,i){ var b=document.createElement("button"); b.type="button"; b.className="chip"; b.textContent="Foto "+(i+1); b.setAttribute("aria-pressed",i===0);
    b.onclick=function(){ PROMO.ix=i; $("promoPics").querySelectorAll("button").forEach(function(x,j){x.setAttribute("aria-pressed",j===i)}); drawPromo() }; $("promoPics").appendChild(b) });
  var p=pubPrice(m), sp=keySpecs(m);
  var t=m.name+"\n\n"+sp.map(function(r){return r[0]+": "+r[1]}).join("\n")+"\n\nPrecio: "+money(p)+" USD"+(ADJ<0?" (antes "+money(+m.price||0)+")":"")+"\nIncluye caja de presentación ARAMI grabada.\n\nPídelo por WhatsApp: "+phoneFmt()+"\n"+SITE;
  $("promoText").value=t; $("promoWa").href="https://wa.me/?text="+encodeURIComponent(t); $("promoMsg").textContent="";
  $("promo").hidden=false; drawPromo(); $("promo").scrollIntoView({behavior:"smooth",block:"start"}) }
function loadImg(src){ return new Promise(function(res,rej){ var i=new Image(); i.onload=function(){res(i)}; i.onerror=rej; i.src=src }) }
function fitFont(x,text,weight,family,max,min,width){ var s=max; do{ x.font=weight+" "+s+"px "+family; if(x.measureText(text).width<=width) break; s-=2 }while(s>min); return s }
async function drawPromo(){
  var m=CAT.models.filter(function(x){return x.id===PROMO.id})[0]; if(!m) return;
  var story=PROMO.fmt==="story", W=1080, H=story?1920:1350, c=$("promoCanvas"); c.width=W; c.height=H; var x=c.getContext("2d");
  var D='"Syncopate","Arial Black",sans-serif', B='"Manrope",system-ui,sans-serif', M='"IBM Plex Mono",ui-monospace,monospace';
  try{ await Promise.all(['700 40px Syncopate','400 40px Syncopate','700 40px Manrope','600 40px Manrope','600 40px "IBM Plex Mono"'].map(function(f){return document.fonts.load(f)})) }catch(e){}
  var L=story?{ph:1080,name:1190,spec:1265,gap:52,sz:36,price:1520,psz:124,incl:1585,band:1665,lab:1735,phone:1808,url:1868}
            :{ph:700,name:790,spec:852,gap:44,sz:30,price:1050,psz:96,incl:1095,band:1140,lab:1194,phone:1256,url:1306};
  x.fillStyle="#0E1C2B"; x.fillRect(0,0,W,H);
  var src=imgsOf(m)[PROMO.ix]||imgsOf(m)[0];
  if(src){ try{ var im=await loadImg(src), r=Math.max(W/im.width,L.ph/im.height), w=im.width*r, h=im.height*r; x.save(); x.beginPath(); x.rect(0,0,W,L.ph); x.clip(); x.drawImage(im,(W-w)/2,(L.ph-h)/2,w,h); x.restore() }catch(e){} }
  var g=x.createLinearGradient(0,L.ph-280,0,L.ph); g.addColorStop(0,"rgba(14,28,43,0)"); g.addColorStop(1,"rgba(14,28,43,1)"); x.fillStyle=g; x.fillRect(0,L.ph-280,W,280);
  var g2=x.createLinearGradient(0,0,0,170); g2.addColorStop(0,"rgba(14,28,43,.75)"); g2.addColorStop(1,"rgba(14,28,43,0)"); x.fillStyle=g2; x.fillRect(0,0,W,170);
  x.textBaseline="alphabetic"; x.textAlign="left";
  try{ x.letterSpacing="10px" }catch(e){} x.font="700 40px "+D; x.fillStyle="#F2F6FA"; x.fillText("ARAMI",60,92);
  try{ x.letterSpacing="8px" }catch(e){} x.font="400 16px "+D; x.fillStyle="#E0B866"; x.fillText("WATCHES",62,124);
  var name=m.name.toUpperCase(); try{ x.letterSpacing="4px" }catch(e){}
  fitFont(x,name,"700",D,story?60:54,30,W-120); x.fillStyle="#F2F6FA"; x.fillText(name,60,L.name);
  try{ x.letterSpacing="0px" }catch(e){}
  var ks=keySpecs(m).slice(0,3), lw=0; x.font="700 "+(L.sz-8)+"px "+B; ks.forEach(function(r){ lw=Math.max(lw,x.measureText(String(r[0]).toUpperCase()).width) });
  ks.forEach(function(r,i){ var y=L.spec+i*L.gap; x.font="700 "+(L.sz-8)+"px "+B; x.fillStyle="#E0B866"; x.fillText(String(r[0]).toUpperCase(),60,y);
    fitFont(x,String(r[1]),"600",B,L.sz,18,W-120-lw-36); x.fillStyle="#D3DEE9"; x.fillText(String(r[1]),60+lw+36,y) });
  var p=pubPrice(m); x.font="600 "+L.psz+"px "+M; x.fillStyle="#FFFFFF"; var pt=money(p); x.fillText(pt,56,L.price); var pw=x.measureText(pt).width;
  x.font="600 "+Math.round(L.psz*.32)+"px "+B; x.fillStyle="#93A5B8"; x.fillText("USD",56+pw+14,L.price);
  if(ADJ<0){ var ox=56+pw+14+x.measureText("USD").width+30, old=money(+m.price||0); x.font="600 "+Math.round(L.psz*.42)+"px "+M; x.fillStyle="#93A5B8"; x.fillText(old,ox,L.price);
    var ow=x.measureText(old).width; x.strokeStyle="#F08A63"; x.lineWidth=4; x.beginPath(); x.moveTo(ox-4,L.price-Math.round(L.psz*.14)); x.lineTo(ox+ow+4,L.price-Math.round(L.psz*.14)); x.stroke();
    x.fillStyle="#B4441F"; var bx=ox+ow+24, bh=Math.round(L.psz*.42); x.beginPath(); x.roundRect?x.roundRect(bx,L.price-bh,bh*2.1,bh,bh/2):x.rect(bx,L.price-bh,bh*2.1,bh); x.fill();
    x.fillStyle="#FFFFFF"; x.font="700 "+Math.round(bh*.55)+"px "+B; x.textAlign="center"; x.fillText(ADJ+"%",bx+bh*1.05,L.price-bh*.3); x.textAlign="left" }
  x.font="600 "+(story?32:26)+"px "+B; x.fillStyle="#E0B866"; x.fillText("Incluye caja de presentación ARAMI grabada",60,L.incl);
  x.fillStyle="#173F72"; x.fillRect(0,L.band,W,H-L.band);
  x.font="700 "+(story?30:24)+"px "+B; x.fillStyle="#BFD3EA"; x.fillText("PIDE POR WHATSAPP",60,L.lab);
  x.font="600 "+(story?64:50)+"px "+M; x.fillStyle="#FFFFFF"; x.fillText(phoneFmt(),60,L.phone);
  x.font="600 "+(story?32:26)+"px "+B; x.fillStyle="#DDE9F4"; x.fillText(SITE.replace(/^https:\/\//,"").replace(/\/$/,""),60,L.url);
}
function downloadPromo(){ var c=$("promoCanvas"), m=CAT.models.filter(function(x){return x.id===PROMO.id})[0], msg=$("promoMsg");
  var fn="ARAMI-"+(m?m.name:"reloj").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"")+"-"+(PROMO.fmt==="story"?"historia":"post")+".png";
  if(!DL){ msg.textContent="En esta vista no se puede descargar. Mantén presionada la imagen para guardarla, o abre la vitrina en claude.ai."; return }
  c.toBlob(function(b){ if(!b){ msg.textContent="No se pudo crear la imagen."; return }
    DL.save({filename:fn,data:b}).then(function(){ msg.textContent="Imagen guardada." },function(e){ var k=e&&e.code;
      msg.textContent=k==="declined"?"Descarga cancelada.":k==="rate_limited"?"Espera un momento e intenta de nuevo.":"No se pudo descargar aquí. Mantén presionada la imagen para guardarla." }) },"image/png") }
function renderSlots(){ var box=$("aSlots"); box.innerHTML="";
  for(var i=0;i<3;i++){ (function(i){ var d=document.createElement("div"); d.className="slot"; var u=edImgs[i];
    d.innerHTML=(u?'<img src="'+u+'" alt="Foto '+(i+1)+'"><button type="button" class="x" aria-label="Quitar foto '+(i+1)+'">×</button>':'<span>+ Foto '+(i+1)+'</span>')+'<input type="file" accept="image/*" aria-label="Elegir foto '+(i+1)+'">';
    d.querySelector("input").onchange=function(e){ takeImg(e.target.files[0],Math.min(i,edImgs.length)) };
    if(u) d.querySelector(".x").onclick=function(){ edImgs.splice(i,1); renderSlots(); $("aImgMsg").textContent="Foto quitada. Toca Guardar y publicar." };
    ["dragover","dragenter"].forEach(function(t){ d.addEventListener(t,function(e){ e.preventDefault(); d.classList.add("over") }) });
    ["dragleave","drop"].forEach(function(t){ d.addEventListener(t,function(){ d.classList.remove("over") }) });
    d.addEventListener("drop",function(e){ e.preventDefault(); takeImg(e.dataTransfer.files[0],Math.min(i,edImgs.length)) });
    box.appendChild(d) })(i) } }
function takeImg(f,i){ if(!f) return; $("aImgMsg").textContent="Cargando foto…";
  shrink(f).then(function(d){ edImgs[i]=d; renderSlots(); $("aImgMsg").textContent="Foto lista. Toca Guardar y publicar." },
    function(){ $("aImgMsg").textContent="No se pudo leer esa imagen. Prueba con una foto JPG o PNG." }) }

function pageHTML(cat){
  var json=JSON.stringify(cat).replace(/</g,"\\u003c");
  return SKEL_HEAD+HEAD_EXTRA+'<style id="css">'+$("css").textContent+'</style>\n<template id="tpl">'+$("tpl").innerHTML+'</template>\n<div id="app"></div>\n<script type="application/json" id="catalog">'+json+'<\/script>\n<script id="appjs">'+$("appjs").textContent+'<\/script></body></html>';
}
async function publishCat(cat,el){
  if(!art){ el.textContent="Esta vista no puede publicar cambios. Abre la página desde claude.ai."; return false }
  ss.set("arami-tab",TAB); el.textContent="Publicando…";
  try{ await art.publish(pageHTML(cat)); el.textContent="Publicado. Actualizando la página…"; return true }
  catch(e){ var c=e&&e.code;
    el.textContent=c==="conflict"?"Había una versión más nueva; la página se está recargando. Vuelve a intentarlo.":
      (c==="not_writer"||c==="not_granted"||c==="not_declared"||c==="capability_disabled")?"Esta vista no puede publicar cambios.":
      c==="too_large"?"La página quedó muy pesada. Usa fotos más pequeñas o quita modelos viejos.":
      c==="rate_limited"?"Demasiados cambios seguidos. Espera un minuto.":"No se pudo publicar. Intenta de nuevo.";
    return false }
}
async function saveModel(){
  var name=$("aName").value.trim(), st=$("aStatus");
  if(!name){ st.textContent="Escribe el nombre del modelo."; return }
  var price=parseFloat($("aPrice").value)||0, cost=parseFloat($("aCost").value)||0;
  var cat=clone(CAT), m;
  if(editing){ m=cat.models.filter(function(x){return x.id===editing})[0] }
  else { m={id:(name.toLowerCase().normalize("NFD").replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"")||"modelo")+"-"+Date.now().toString(36)}; cat.models.push(m) }
  m.name=name; m.price=price; m.show=$("aShow").checked; m.specs={es:parseSpecs($("aSpecsEs").value),en:parseSpecs($("aSpecsEn").value)};
  m.imgs=edImgs.filter(Boolean).slice(0,3); delete m.img;
  $("aSave").disabled=true;
  if(db){ var c=clone(COSTS); c.models[m.id]=cost; st.textContent="Guardando costo…";
    try{ await db.doc("priv/costs").set(c) }catch(e){ st.textContent="No se pudo guardar el costo. Intenta de nuevo."; $("aSave").disabled=false; return } }
  var ok=await publishCat(cat,st); if(!ok) $("aSave").disabled=false;
}
async function deleteModel(){
  var cat=clone(CAT); cat.models=cat.models.filter(function(x){return x.id!==editing});
  if(db){ var c=clone(COSTS); delete c.models[editing]; try{ await db.doc("priv/costs").set(c) }catch(e){} }
  await publishCat(cat,$("aStatus"));
}
var XDRAFT=null;
function renderX(keep){
  var l=$("xList"); if(!l) return;
  if(!keep||!XDRAFT) XDRAFT=EXTRAS.map(function(x){var o=clone(x); o.cost=+COSTS.extras[x.id]||0; return o});
  l.innerHTML="";
  XDRAFT.forEach(function(x,i){ var d=document.createElement("div"); d.className="xrow";
    d.innerHTML='<div class="f"><label for="xes-'+i+'">Nombre</label><input type="text" id="xes-'+i+'" value="'+esc(x.es)+'"></div>'+
      '<div class="f"><label for="xen-'+i+'">En inglés</label><input type="text" id="xen-'+i+'" value="'+esc(x.en)+'"></div>'+
      '<div class="f"><label for="xp-'+i+'">Precio</label><input type="number" id="xp-'+i+'" min="0" value="'+x.price+'"></div>'+
      '<div class="f"><label for="xc-'+i+'">Tu costo</label><input type="number" id="xc-'+i+'" min="0" value="'+x.cost+'"></div>'+
      '<button type="button" class="btn ghost sm">Quitar</button>';
    var ins=d.querySelectorAll("input");
    ins[0].oninput=function(){x.es=ins[0].value}; ins[1].oninput=function(){x.en=ins[1].value};
    ins[2].oninput=function(){x.price=parseFloat(ins[2].value)||0}; ins[3].oninput=function(){x.cost=parseFloat(ins[3].value)||0};
    d.querySelector("button").onclick=function(){ XDRAFT.splice(i,1); renderX(true) };
    l.appendChild(d) });
}
async function saveExtras(){
  var st=$("xStatus"), cat=clone(CAT), c=clone(COSTS); c.extras={};
  cat.extras=XDRAFT.map(function(x){ c.extras[x.id]=x.cost; var o={id:x.id,price:x.price,es:x.es.trim()||"Extra",en:x.en.trim()||x.es.trim()||"Extra"}; if(x.eng) o.eng=true; if(x.engBox) o.engBox=true; return o });
  $("xSave").disabled=true;
  if(db){ try{ await db.doc("priv/costs").set(c) }catch(e){ st.textContent="No se pudieron guardar los costos."; $("xSave").disabled=false; return } }
  if(!(await publishCat(cat,st))) $("xSave").disabled=false;
}
})();
